<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">앞차 유무에 따른 속도별 플래너 가속 상한 비교</title>
  <desc id="desc">앞차가 있으면 추종 상한을, 없으면 일반 주행 상한을 선택한다. 두 곡선 모두 강제 목표가 아니라 최대 허용값이다.</desc>
  <style>
    :root { --bg:#fff; --fg:#202124; --muted:#5f6368; --grid:#dfe3e8; --no-lead:#2878d0; --following:#d97706; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#17191c; --fg:#f1f3f4; --muted:#b0b7c3; --grid:#3a4048; --no-lead:#6eb4ff; --following:#ffb454; }
    }
    .bg { fill:var(--bg); }
    .grid { stroke:var(--grid); stroke-width:1; }
    .axis { stroke:var(--muted); stroke-width:1.5; }
    .no-lead-line { fill:none; stroke:var(--no-lead); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .following-line { fill:none; stroke:var(--following); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .no-lead-point { fill:var(--bg); stroke:var(--no-lead); stroke-width:3; }
    .following-point { fill:var(--following); stroke:var(--bg); stroke-width:2; }
    text { fill:var(--fg); font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif; font-size:14px; }
    .muted { fill:var(--muted); }
    .legend { font-size:15px; font-weight:600; }
    .note { font-size:13px; }
  </style>

  <rect class="bg" width="1000" height="500"/>
  <text x="80" y="28" class="muted">선택 가속 상한 (m/s²)</text>

  <g aria-hidden="true">
    <line class="grid" x1="80" y1="360" x2="940" y2="360"/><text class="muted" x="66" y="365" text-anchor="end">0.8</text>
    <line class="grid" x1="80" y1="300" x2="940" y2="300"/><text class="muted" x="66" y="305" text-anchor="end">1.0</text>
    <line class="grid" x1="80" y1="240" x2="940" y2="240"/><text class="muted" x="66" y="245" text-anchor="end">1.2</text>
    <line class="grid" x1="80" y1="180" x2="940" y2="180"/><text class="muted" x="66" y="185" text-anchor="end">1.4</text>
    <line class="grid" x1="80" y1="120" x2="940" y2="120"/><text class="muted" x="66" y="125" text-anchor="end">1.6</text>
    <line class="grid" x1="80" y1="60" x2="940" y2="60"/><text class="muted" x="66" y="65" text-anchor="end">1.8</text>
  </g>

  <line class="axis" x1="80" y1="60" x2="80" y2="390"/>
  <line class="axis" x1="80" y1="390" x2="940" y2="390"/>

  <g aria-hidden="true">
    <line class="axis" x1="80" y1="390" x2="80" y2="397"/><text class="muted" x="80" y="420" text-anchor="middle">0</text>
    <line class="axis" x1="166" y1="390" x2="166" y2="397"/><text class="muted" x="166" y="420" text-anchor="middle">10</text>
    <line class="axis" x1="252" y1="390" x2="252" y2="397"/><text class="muted" x="252" y="420" text-anchor="middle">20</text>
    <line class="axis" x1="338" y1="390" x2="338" y2="397"/><text class="muted" x="338" y="420" text-anchor="middle">30</text>
    <line class="axis" x1="424" y1="390" x2="424" y2="397"/><text class="muted" x="424" y="420" text-anchor="middle">40</text>
    <line class="axis" x1="510" y1="390" x2="510" y2="397"/><text class="muted" x="510" y="420" text-anchor="middle">50</text>
    <line class="axis" x1="596" y1="390" x2="596" y2="397"/><text class="muted" x="596" y="420" text-anchor="middle">60</text>
    <line class="axis" x1="682" y1="390" x2="682" y2="397"/><text class="muted" x="682" y="420" text-anchor="middle">70</text>
    <line class="axis" x1="768" y1="390" x2="768" y2="397"/><text class="muted" x="768" y="420" text-anchor="middle">80</text>
    <line class="axis" x1="854" y1="390" x2="854" y2="397"/><text class="muted" x="854" y="420" text-anchor="middle">90</text>
    <line class="axis" x1="940" y1="390" x2="940" y2="397"/><text class="muted" x="940" y="420" text-anchor="middle">100</text>
  </g>
  <text x="940" y="444" text-anchor="end" class="muted">현재 속도 (km/h)</text>

  <polyline class="no-lead-line" points="80,270 88.6,238.65 166,253.5 209,270 252,315 338,362.4 424,373.5 553,379.5 682,369 811,350.4 940,375.6"/>
  <polyline class="following-line" points="80,156.48 88.6,114.16 166,132.46 209,91.8 252,159 338,321 424,333 553,342 682,329.4 811,322.8 940,355.8"/>

  <g aria-label="앞차 없음 기준점">
    <circle class="no-lead-point" cx="80" cy="270" r="5"/><circle class="no-lead-point" cx="88.6" cy="238.65" r="5"/>
    <circle class="no-lead-point" cx="166" cy="253.5" r="5"/><circle class="no-lead-point" cx="209" cy="270" r="5"/>
    <circle class="no-lead-point" cx="252" cy="315" r="5"/><circle class="no-lead-point" cx="338" cy="362.4" r="5"/>
    <circle class="no-lead-point" cx="424" cy="373.5" r="5"/><circle class="no-lead-point" cx="553" cy="379.5" r="5"/>
    <circle class="no-lead-point" cx="682" cy="369" r="5"/><circle class="no-lead-point" cx="811" cy="350.4" r="5"/>
    <circle class="no-lead-point" cx="940" cy="375.6" r="5"/>
  </g>
  <g aria-label="앞차 추종 기준점">
    <circle class="following-point" cx="80" cy="156.48" r="6"/><circle class="following-point" cx="88.6" cy="114.16" r="6"/>
    <circle class="following-point" cx="166" cy="132.46" r="6"/><circle class="following-point" cx="209" cy="91.8" r="6"/>
    <circle class="following-point" cx="252" cy="159" r="6"/><circle class="following-point" cx="338" cy="321" r="6"/>
    <circle class="following-point" cx="424" cy="333" r="6"/><circle class="following-point" cx="553" cy="342" r="6"/>
    <circle class="following-point" cx="682" cy="329.4" r="6"/><circle class="following-point" cx="811" cy="322.8" r="6"/>
    <circle class="following-point" cx="940" cy="355.8" r="6"/>
  </g>

  <g transform="translate(80 468)">
    <line class="no-lead-line" x1="0" y1="0" x2="34" y2="0"/><circle class="no-lead-point" cx="17" cy="0" r="5"/>
    <text class="legend" x="46" y="5">앞차 없음</text>
    <line class="following-line" x1="178" y1="0" x2="212" y2="0"/><circle class="following-point" cx="195" cy="0" r="6"/>
    <text class="legend" x="224" y="5">앞차 추종</text>
    <text class="muted note" x="430" y="5">상한은 강제 목표가 아니라 최대 허용값</text>
  </g>
</svg>
